id: tools
title: Community curated tools
tabs:
- id: antimicrobial_resistance_prediction
  title: Antimicrobial resistance prediction
  heading_md: 'Top 5 tool with EDAM operation: Antimicrobial resistance prediction'
  content:
  - title_md: abricate
    description_md: |-
      Mass screening of contigs for antiobiotic resistance genes
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%abricate%abricate">abricate</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%abricate%abricate_list">abricate_list</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%abricate%abricate_summary">abricate_summary</a></li>
      </ul>
  - title_md: tb-profiler
    description_md: |-
      Processes M. tuberculosis sequence data to infer strain type and identify known drug resistance markers.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%tb-profiler%tb_profiler_profile">tb_profiler_profile</a></li>
      </ul>
  - title_md: hamronization
    description_md: |-
      Convert AMR gene detection tool output to hAMRonization specification format.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%hamronization%hamronize_summarize">hamronize_summarize</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%hamronization%hamronize_tool">hamronize_tool</a></li>
      </ul>
  - title_md: amrfinderplus
    description_md: |-
      "AMRFinderPlus is designed to find acquired antimicrobial resistance genes and point mutations in protein and/or assembled nucleotide sequences.It can also search "plus", stress, heat, and biocide resistance and virulence factors for some organisms.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%amrfinderplus%amrfinderplus">amrfinderplus</a></li>
      </ul>
  - title_md: pharokka
    description_md: |-
      rapid standardised annotation tool for bacteriophage genomes and metagenomes
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%pharokka%pharokka">pharokka</a></li>
      </ul>
- id: genome_annotation
  title: Genome annotation
  heading_md: 'Top 5 tool with EDAM operation: Genome annotation'
  content:
  - title_md: prokka
    description_md: |-
      Rapid annotation of prokaryotic genomes
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%crs4%prokka%prokka">prokka</a></li>
      </ul>
  - title_md: mitos
    description_md: |-
      de-novo annotation of metazoan mitochondrial genomes
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%mitos%mitos">mitos</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%mitos%mitos2">mitos2</a></li>
      </ul>
  - title_md: integron_finder
    description_md: |-
      "IntegronFinder identify integrons with high accuracy and sensitivity.It searches for attC sites using covariance models, for integron-integrases using HMM profiles, and for other features (promoters, attI site) using pattern matching"
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%integron_finder%integron_finder">integron_finder</a></li>
      </ul>
  - title_md: eggnog_mapper
    description_md: |-
      eggnog-mapper fast functional annotation of novel sequences
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%galaxyp%eggnog_mapper%eggnog_mapper">eggnog_mapper</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%galaxyp%eggnog_mapper%eggnog_mapper_annotate">eggnog_mapper_annotate</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%galaxyp%eggnog_mapper%eggnog_mapper_search">eggnog_mapper_search</a></li>
      </ul>
  - title_md: bakta
    description_md: |-
      "Bakta is a tool for the rapid & standardized annotation of bacterial genomes and plasmids from both isolates and MAGs.It provides dbxref-rich and sORF-including annotations in machine-readable JSON & bioinformatics standard file formats for automatic downstream analysis."
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%bakta%bakta">bakta</a></li>
      </ul>
