- id: taxonomic_classification
  title: Taxonomic classification
  heading_md: 'Top 5 tool with EDAM operation: Taxonomic classification'
  content:
  - title_md: kraken2
    description_md: |-
      Kraken2 for taxonomic designation.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%kraken2%kraken2">kraken2</a></li>
      </ul>
  - title_md: kraken
    description_md: |-
      Kraken is a system for assigning taxonomic labels to short DNAsequences, usually obtained through metagenomic studies. Previous attempts by otherbioinformatics software to accomplish this task have often used sequence alignmentor machine learning techniques that were quite slow, leading to the developmentof less sensitive but much faster abundance estimation programs. Kraken aims toachieve high sensitivity and high speed by utilizing exact alignments of k-mersand a novel classification algorithm.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%devteam%kraken%kraken-filter">kraken-filter</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%devteam%kraken%kraken-mpa-report">kraken-mpa-report</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%devteam%kraken%kraken-report">kraken-report</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%devteam%kraken%kraken-translate">kraken-translate</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%devteam%kraken%kraken">kraken</a></li>
      </ul>
