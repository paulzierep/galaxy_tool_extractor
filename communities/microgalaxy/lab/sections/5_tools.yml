id: tools
title: Community curated tools
tabs:
- id: antimicrobial_resistance_prediction
  title: Antimicrobial resistance prediction
  heading_md: 'Top 10 for the EDAM operation: Antimicrobial resistance prediction'
  content:
  - title_md: abricate
    description_md: |-
      Mass screening of contigs for antiobiotic resistance genes
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%abricate%abricate">abricate</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%abricate%abricate_list">abricate_list</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%abricate%abricate_summary">abricate_summary</a></li>
      </ul>
  - title_md: tb-profiler
    description_md: |-
      Processes M. tuberculosis sequence data to infer strain type and identify known drug resistance markers.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%tb-profiler%tb_profiler_profile">tb_profiler_profile</a></li>
      </ul>
  - title_md: hamronization
    description_md: |-
      Convert AMR gene detection tool output to hAMRonization specification format.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%hamronization%hamronize_summarize">hamronize_summarize</a></li>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%hamronization%hamronize_tool">hamronize_tool</a></li>
      </ul>
  - title_md: amrfinderplus
    description_md: |-
      "AMRFinderPlus is designed to find acquired antimicrobial resistance genes and point mutations in protein and/or assembled nucleotide sequences.It can also search "plus", stress, heat, and biocide resistance and virulence factors for some organisms.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%amrfinderplus%amrfinderplus">amrfinderplus</a></li>
      </ul>
  - title_md: pharokka
    description_md: |-
      rapid standardised annotation tool for bacteriophage genomes and metagenomes
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%pharokka%pharokka">pharokka</a></li>
      </ul>
  - title_md: seqsero2
    description_md: |-
      Salmonella serotype prediction from genome sequencing data
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%seqsero2%seqsero2">seqsero2</a></li>
      </ul>
  - title_md: fargene
    description_md: |-
      fARGene (Fragmented Antibiotic Resistance Gene iENntifiEr )
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%fargene%fargene">fargene</a></li>
      </ul>
  - title_md: abritamr
    description_md: |-
      A pipeline for running AMRfinderPlus and collating results into functional classes
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%abritamr%abritamr">abritamr</a></li>
      </ul>
  - title_md: sonneityping
    description_md: |-
      Scripts for parsing Mykrobe predict results for Shigella sonnei.
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%sonneityping%sonneityping">sonneityping</a></li>
      </ul>
  - title_md: mykrobe
    description_md: |-
      Antibiotic resistance predictions
      <ul>
        <li><a href="{{ galaxy_base_url }}/tool_runner?tool_id=toolshed.g2.bx.psu.edu%Frepos%iuc%mykrobe%mykrobe_predict">mykrobe_predict</a></li>
      </ul>
